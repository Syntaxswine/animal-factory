<p>RED SHIFT / FACTION ART</p><h1>The Red Hats.</h1><p>Six new recruits in the foreman's uniform. Red caps and armbands unite the faction; each animal keeps its own face and silhouette. Standing, unarmed uniform studies.</p>
<div class="controls"><label><input id="compare" type="checkbox"> Compare original outfits</label><label><input id="mirror" type="checkbox"> Face left</label><label>Scale <select id="scale"><option value="large">Detail</option><option value="small">Game size</option></select></label></div>
<main class="grid" id="gallery">
<figure><h2>horse</h2><div class="pair"><img class="original" src="../assets/characters/horse-idle.png" alt="horse original outfit"><img src="../assets/characters/red-hats/horse-idle.png" alt="horse Red Hats uniform"></div><figcaption>Red Hats · horse</figcaption></figure>
<figure><h2>goat</h2><div class="pair"><img class="original" src="../assets/characters/goat-idle.png" alt="goat original outfit"><img src="../assets/characters/red-hats/goat-idle.png" alt="goat Red Hats uniform"></div><figcaption>Red Hats · goat</figcaption></figure>
<figure><h2>donkey</h2><div class="pair"><img class="original" src="../assets/characters/donkey-idle.png" alt="donkey original outfit"><img src="../assets/characters/red-hats/donkey-idle.png" alt="donkey Red Hats uniform"></div><figcaption>Red Hats · donkey</figcaption></figure>
<figure><h2>sheep</h2><div class="pair"><img class="original" src="../assets/characters/sheep-idle.png" alt="sheep original outfit"><img src="../assets/characters/red-hats/sheep-idle.png" alt="sheep Red Hats uniform"></div><figcaption>Red Hats · sheep</figcaption></figure>
<figure><h2>cow</h2><div class="pair"><img class="original" src="../assets/characters/cow-idle.png" alt="cow original outfit"><img src="../assets/characters/red-hats/cow-idle.png" alt="cow Red Hats uniform"></div><figcaption>Red Hats · cow</figcaption></figure>

<figure><h2>Pig foreman</h2><div class="pair"><img src="../assets/characters/pig-foreman-idle.png" alt="Pig foreman uniform reference"></div><figcaption>Existing faction uniform reference</figcaption></figure>
</main><script type="module">
const gallery=document.querySelector('#gallery');
for(const id of ['compare','mirror'])document.querySelector('#'+id).onchange=e=>gallery.classList.toggle(id,e.target.checked);
