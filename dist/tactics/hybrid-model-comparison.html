<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Horse comparison · painted low-poly model</title>
<style>body{margin:0;height:100vh;display:flex;flex-direction:column;background:#172520;color:#eee5cd;font:14px system-ui}header{flex:none;padding:14px 20px;border-bottom:1px solid #657160}h1{font-size:21px;margin:0 0 8px}label{display:inline-block;margin:3px 18px 3px 0}select,button{background:#344a3e;color:#fff;border:1px solid #788470;padding:5px}#scene{flex:1;min-height:300px;position:relative}canvas{display:block}footer{flex:none;padding:10px 20px;white-space:pre-wrap}input[type=range]{width:190px;vertical-align:middle}.note{color:#bdc5b1;margin:7px 0 0}</style>
<header><h1>Horse worker · intact sprite / painted low-poly model</h1>
<label>View <select id="mode"><option value="both">Side by side</option><option value="sprite">Original sprite only</option><option value="model">3D model only</option></select></label>
<label>Pose <select id="stance"><option>standing</option><option>kneeling</option><option>prone</option></select></label>
<label>Rifle <select id="hold"><option value="carry">Relaxed carry</option><option value="aim">Shouldered aim</option></select></label>
<label>Heading <input id="heading" type="range" min="0" max="360" step="any" value="0"> <output id="angle">0°</output></label>
<button id="sweep">Sweep heading</button><label><input id="close" type="checkbox"> Close view</label><label><input id="bounds" type="checkbox"> Collision and muzzle overlay</label>
<label><input id="wire" type="checkbox"> Model wireframe</label><label><input id="orbit" type="checkbox"> Diagnostic orbit</label><button id="reset">Reset camera</button>
<div><button id="sequence">Play sequence</button> <button id="replay">Replay</button> <button id="static">Static comparison</button> <label>Sequence <input id="time" type="range" min="0" max="10" step="0.01" value="0"> <output id="phase">0.00 s</output></label></div><p class="note">Left: existing normal-uniform horse sprite. Right: one low-poly horse, painted atlas and articulated pose rig. Walk → kneel → aim → fire → stand. Presentation study only; no gameplay actions or vertical targeting.</p></header>
<div id="scene"></div><footer id="status">Loading room and character…</footer>
<script type="module" src="./hybrid-model-comparison.js"></script></html>
